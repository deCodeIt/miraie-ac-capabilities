[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miraie-ac-capabilities"
version = "0.1.0"
authors = [
  { name="Ali Jafri", email="your.email@example.com" },
]
description = "A library for managing Panasonic MirAIe AC capabilities"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/miraie_ac_capabilities"]
